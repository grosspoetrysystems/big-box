version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
  exclusions:
    generated: strict
    rules:
      - path: '_test\.go'
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - gci

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
